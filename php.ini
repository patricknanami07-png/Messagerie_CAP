expose_php = 0
display_errors = 0
log_errors = 1
memory_limit = 256M
max_execution_time = 30
date.timezone = UTC

; L'application accepte des fichiers jusqu'à 10 Mo (pièces jointes + messages vocaux).
; Le défaut PHP (2 Mo) ferait échouer silencieusement les envois plus lourds.
upload_max_filesize = 12M
post_max_size = 16M

session.cookie_httponly = 1
session.use_strict_mode = 1

; Image immuable : inutile de vérifier les dates de fichiers à chaque requête.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
