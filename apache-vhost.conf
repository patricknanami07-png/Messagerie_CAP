<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Render termine le HTTPS en amont. On le signale à PHP/Symfony pour que
    # cookie_secure: auto et la génération d'URL fonctionnent correctement.
    SetEnvIf X-Forwarded-Proto "^https" HTTPS=on

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Équivalent du .htaccess Symfony : tout ce qui n'est pas un fichier -> index.php
        FallbackResource /index.php
    </Directory>

    # Aucun fichier caché (.env, .git...) ne doit être servi.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=15552000" env=HTTPS

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
